name: Update README cards

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-cards.yml

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          # プライベートリポジトリの統計も含める場合は、repo / read:user スコープの
          # PAT を STATS_TOKEN という名前で Secrets に登録する（未登録なら公開分のみ）
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # 取得失敗時にエラーカードで上書きしない
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
